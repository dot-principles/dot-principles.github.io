name: Audit gate regression

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check-audit-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install skill files
        run: bash install.sh vendor .
      - name: Verify audit gate markers (Phases 8–10)
        run: ./tests/check-audit-gates.sh
      - name: Verify retired command migration
        run: bash ./tests/check-retired-prime.sh
      - name: Verify extra-catalog index
        run: bash ./tests/check-extra-index.sh
      - name: Verify uninstall removes generated review files
        run: bash ./tests/check-uninstall-generated.sh
      - name: Verify documentation has no stale references
        run: bash ./tests/check-stale-docs.sh
